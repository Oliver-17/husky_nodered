# =============================================================================
#  warehouse_nav2_husky.yaml — 倉庫場景的 Nav2 參數（地面車 Husky A200）
#
#  這份是從 drone_nodered/config/warehouse_nav2.yaml **衍生**的。
#  共用的部分（地圖、走道幾何、planner、復原行為、bt_navigator 的逾時修正）
#  原封不動照抄，理由都還寫在原檔裡，不重複。
#
#  下面只記「和無人機不一樣的地方，以及為什麼」：
#
#  ┌────────────────────┬──────────────┬──────────────┬──────────────────────┐
#  │ 項目               │ 無人機 x500  │ Husky A200   │ 原因                 │
#  ├────────────────────┼──────────────┼──────────────┼──────────────────────┤
#  │ use_sim_time       │ false        │ **true**     │ 見下方「時鐘」       │
#  │ 機體外形           │ robot_radius │ **footprint**│ 長方形，不是圓       │
#  │ max_vel_y          │ 1.2          │ **0.0**      │ 差速車不能側移       │
#  │ vy_samples         │ 10           │ **1**        │ 同上                 │
#  │ max_vel_x          │ 1.2          │ **1.0**      │ A200 原廠上限        │
#  │ max_vel_theta      │ 0.8          │ **1.0**      │ 要靠轉向才能改方向   │
#  │ yaw_goal_tolerance │ 3.14（不管） │ **0.26**     │ 車頭有意義（15°）    │
#  │ critics            │ 含 Twirling  │ **含 *Align**│ 見下方「critics」    │
#  │ FollowPath         │ 純 DWB       │ **RotationShim**│ 見下方「起步」    │
#  └────────────────────┴──────────────┴──────────────┴──────────────────────┘
#
#  ── 時鐘：這份是 use_sim_time: true ───────────────────────────────────────
#  無人機那份刻意用 false，因為 sim_all 沒有橋 /clock，時間來源是真實時鐘。
#  Husky 這條鏈不一樣：odom 和 TF 都是 ros_gz_bridge 從 Gazebo 轉過來的，
#  時間戳是**模擬時間**。如果 Nav2 用真實時鐘，兩邊差好幾個數量級，
#  會一直噴 extrapolation into the future 然後什麼都不動。
#  所以 husky_sim.launch.py 會橋 /clock，這裡全部設 true。
#  ⚠️ 兩台同場（H5）時要注意：這代表 Husky 這條鏈和無人機那條鏈用不同時鐘。
#
#  ── 機體外形：用 footprint 不用 robot_radius ─────────────────────────────
#  Husky 是 0.99 x 0.67 m 的長方形，外接圓半徑 0.6 m。用圓形近似的話，
#  要嘛太保守（0.6 m 的圓在 4 m 走道裡過不去兩台），要嘛會擦到角。
#  數字來源是原廠模型本身，不要另外查規格表 —— 見
#  husky_nodered/gz/models/husky/model.sdf 的檔頭。
#
#  ── critics：把 PathAlign / GoalAlign 加回來 ─────────────────────────────
#  無人機那份把這兩個拿掉、換成 Twirling，理由是「機頭和移動方向無關」。
#  差速車剛好相反：車頭**就是**移動方向，這兩個 critic 正是在獎勵
#  「車頭對準路徑」，對 Husky 是必要的。Twirling（懲罰旋轉）要拿掉 ——
#  它是為全向機體寫的，留著會讓車子不願意轉，直接卡在原地。
#  RotateToGoal 也加回來：終點朝向現在有意義了。
#
#  ── 起步：用 RotationShimController 包住 DWB ─────────────────────────────
#  差速車收到目標時如果路徑往側邊，DWB 會邊轉邊走畫出一條很大的弧，
#  在 4 m 寬的走道裡會擦到膨脹層。RotationShim 的作法是先原地轉到大致
#  對準路徑（差速車做得到，左右輪反轉），再把控制權交給 DWB。
#  無人機不需要這一步，因為它可以直接側移過去。
# =============================================================================

/husky/global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      # 1 Hz 就夠。牆不會跑掉，而 40x34 m @ 0.1 m 是 16 萬格，
      # 更新頻率拉高只是白燒 CPU。
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: husky/base_link

      # 跟 gen_arena.py 產生的靜態地圖一致。不一致的話 StaticLayer 要重新取樣，
      # 牆的邊緣會糊掉一格，膨脹層跟著偏。
      resolution: 0.1

      # rolling_window: false = 固定不動，涵蓋整張地圖。
      # 尺寸會在 StaticLayer 載入地圖時自動對齊，這裡的值只是初始值。
      rolling_window: false
      width: 44
      height: 38

      # Husky 是長方形，不是圓。0.99 x 0.67 m（來源：原廠模型），
      # 四個角以車體中心為原點。用圓形近似會太保守或擦到角。
      # ⚠️ footprint 和 robot_radius 只能擇一，兩個都寫的話 robot_radius 贏。
      footprint: "[[0.495, 0.335], [0.495, -0.335], [-0.495, -0.335], [-0.495, 0.335]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /MAV1/scan
          data_type: "LaserScan"
          clearing: true
          marking: true

          # ⚠️⚠️ 這兩行是無人機跟地面機器人最大的差異，也是最容易中的陷阱。
          #
          # ObstacleLayer 會把掃到的點轉到世界座標，然後用高度範圍過濾
          # （observation_buffer.hpp:67-68：「a hitpoint to be considered legal」）。
          # Nav2 的預設是 max_obstacle_height: 2.0 —— 那是給地面機器人的，
          # 它的光達裝在離地 0.2 m。
          #
          # 我們的光達裝在「飛行高度」上，3 m 飛行時打到牆的點在世界座標是 z≈3 m，
          # 用預設值會被「整批」濾掉 —— costmap 的障礙物層什麼都看不到，
          # 而且不會有任何警告，只會覺得「光達好像沒作用」。
          min_obstacle_height: 0.0
          max_obstacle_height: 10.0

          # 量程。光達本身是 0.1~30 m，但刻意不用滿：
          # 無人機加速時會傾斜（2 m/s² 約 11.5 度），傾斜時朝下的光束會打到地板，
          # 在 3 m 高度約 15 m 處。限制在 12 m 以內就不會把地板當成牆。
          obstacle_max_range: 12.0
          raytrace_max_range: 15.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 成本遞減的範圍。不是禁區 —— 只是「不喜歡」，規劃器會盡量走中間。
        #
        # 為什麼單機用 1.0 而不是 check_graph.py 的淨空門檻 2.5：
        # 北道被 pinch 夾到只剩 6 m 寬，用 2.5 的話中間只有 1 m 是低成本區，
        # Nav2 會「永遠」選南道 —— 那樣就驗不出拓樸圖的 penalty 有沒有在作用了。
        # ⚠️ 三機編隊時要連 robot_radius 一起調大。
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

# -----------------------------------------------------------------------------
#  區域 costmap —— 跟著飛機移動的小視窗，給即時避障用
# -----------------------------------------------------------------------------
/husky/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # 20 Hz。區域 costmap 要應付「突然冒出來的東西」，
      # 而且格數少（6x6 m @ 0.1 m = 3600 格），吃得起這個頻率。
      update_frequency: 20.0
      publish_frequency: 5.0

      global_frame: husky/odom
      robot_base_frame: husky/base_link

      resolution: 0.1
      rolling_window: true

      # 6x6 m（Nav2 預設是 3x3，給時速很慢的地面機器人）。
      # 依據：最高 1.5 m/s、DWA 往前模擬約 2 秒 = 3 m，視窗半徑要大於那個距離。
      width: 6
      height: 6

      footprint: "[[0.495, 0.335], [0.495, -0.335], [-0.495, -0.335], [-0.495, 0.335]]"

      # ⚠️ 2026-10-06 從 ["obstacle_layer", "inflation_layer"] 改成這個。
      #
      # arena 的設計是「區域 costmap 只關心眼前有什麼，整張地圖的記憶交給全域
      # costmap」，所以只放 obstacle_layer 吃光達。那個前提是機體有光達 ——
      # arena 用的 x500_nav2 有，**但倉庫用的 x500 沒有**。
      #
      # 沒有光達又只有 obstacle_layer 的話，區域 costmap 會是**全空的**：
      #     planner_server 讀全域 costmap → 會規劃繞過貨架 ✓
      #     controller_server / DWB 讀區域 costmap → 完全不知道有貨架 ✗
      # 而 DWB 的 BaseObstacleCritic 對致命格是**硬拒絕**（直接丟棄那條軌跡），
      # 那是真正的安全網 —— 前提是區域 costmap 看得到東西。
      # 路徑繞過去了但飛機一偏離路徑就沒有任何東西擋它，是最糟的組合。
      #
      # Oliver 2026-10-06 選 A 案：「先 A 不要求即時避障」。
      # 代價：DWB 只看得到地圖上畫的東西，看不到地圖外臨時出現的障礙。
      # 要即時避障就換 B 案（機體改 x500_nav2，obstacle_layer 就活了）。
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # map_server 用 transient local 發佈地圖，訂閱端要對上才收得到，
        # 否則這一層會永遠是空的（和全域 costmap 的設定一致）。
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

# -----------------------------------------------------------------------------
#  全域路徑規劃
#
#  S4 只需要它「把 global_costmap 帶起來」，還不會送目標給它。
#  規劃行為本身是 S5 在驗的。
# -----------------------------------------------------------------------------
/husky/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      # NavfnPlanner = 格點上的 Dijkstra / A*。
      # 不用 SmacPlannerHybrid：那是給「有轉彎半徑限制」的車型用的，
      # 無人機可以原地橫移，用它只是自找麻煩。
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 目標被障礙物佔住時，允許規劃到這個距離內的替代點
      tolerance: 0.5
      # false = Dijkstra。場地只有 40x34 m，A* 省下的時間可以忽略，
      # 而 Dijkstra 的路徑比較平滑（A* 會偏向啟發式的方向，容易貼著障礙物）。
      use_astar: false
      # 不准穿過「沒有資料」的區域。地圖邊界之外就是未知，
      # 這一條等於替我們把規劃範圍鎖在地圖內。
      allow_unknown: false

# -----------------------------------------------------------------------------
#  地圖伺服器
# -----------------------------------------------------------------------------
/husky/map_server:
  ros__parameters:
    use_sim_time: true
    # 實際路徑由 launch 填入（要用 get_package_share_directory 展開）
    yaml_filename: ""


# -----------------------------------------------------------------------------
#  區域控制（S6）—— 這一層才會真的讓飛機動
#
#  它同時會建立 local_costmap 這個子節點（讀上面那段參數）。
# -----------------------------------------------------------------------------
/husky/controller_server:
  ros__parameters:
    use_sim_time: true
    # ⚠️ 2026-10-07：20.0 → 10.0，和實機那份對齊
    #    （drone_bringup/config/real/nav2_params.yaml）。
    #    這個頻率是 DWB 運算量的乘數：每一拍都要把 vx×vy×vθ 條候選軌跡
    #    各自往前模擬 sim_time 再用每個 critic 打分。
    #    這裡會跟著改不是因為開發機 CPU 不夠，而是因為倉庫這套的用途是
    #    「實機飛之前的排練」—— 控制頻率不同，在模擬裡調出來的手感就搬不過去。
    controller_frequency: 10.0

    # ⚠️ 這一格是無人機和地面機器人最大的差異。
    #    Nav2 預設是 0.5 —— 意思是「y 方向速度小於 0.5 就當成 0」，
    #    因為差速輪機器人根本不能橫移，那個值是雜訊。
    #    無人機可以橫移，用預設值會把所有小幅度的側向修正全部歸零，
    #    飛起來會變成「只會前進和轉頭」的笨重車。
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 多久之內至少要移動這麼多，否則判定卡住。
      # 無人機起步比輪型機器人慢（要先傾斜才會有水平加速度），所以放寬到 15 秒。
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # ⚠️ 2026-11-07：0.25 → 0.40。對一台 0.99 m 長的滑移轉向車太緊 ——
      #    實測停在離目標 0.28 m 就搶不到最後 3 公分，只能原地抽動。
      #    0.40 和無人機那份一致，也大於煞停距離 0.33 m（1.0 m/s 配 decel 1.5）。
      xy_goal_tolerance: 0.40
      # 航向不設限：飛機是全向的，到了就好，不需要轉到特定角度。
      # 設小的話 DWB 會在終點原地轉半天。
      # ⚠️ 2026-11-07：0.26 → 3.14（不檢查終點朝向）。
      #    「車頭有意義」指的是**移動過程**（車只能往車頭方向走，所以
      #    PathAlign／GoalAlign／RotationShim 都要留著），不是抵達時的朝向。
      #    四個任務需求（導航／返航／停止／狀態查詢）沒有一項要求車頭朝哪。
      #    硬要求的後果實測過：終點附近在 +80° 來回抽動（67°→91°→67°），
      #    36.8 m 的路跑完只花 51 秒，卻在終點耗掉 166 秒最後逾時失敗。
      #    真的需要指定抵達朝向時再回來處理，而且要連 RotateToGoal 一起調。
      yaw_goal_tolerance: 3.14

    FollowPath:
      # 先原地轉對準路徑，再交給 DWB 跟線（見檔頭「起步」）。
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785      # 路徑方向差超過 45° 就先原地轉
      forward_sampling_distance: 0.5     # 取路徑前方 0.5 m 當「要對準的方向」
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.5
      simulate_ahead_time: 1.0
      debug_trajectory_details: true

      # --- 速度上限 ---
      #
      # ⚠️ 2026-10-12：0.8 → 1.2（Oliver 問「導航可不可以跟巡航一樣快」）。
      #    原本的 0.8 不是調校結果，是「第一次飛先保守」的暫定值。
      #    實測見 test/tools/run_goto_bench.sh（起飛點 → map (5.6, 7.0)）。
      #
      # 為什麼停在 1.2 而不是更高 —— 有兩個硬天花板：
      #   ① 1.5 m/s：cmd_vel_to_px4_node 的 max_speed_xy（px4_bridge.yaml）
      #      會把超出的夾掉（cmd_vel_to_px4_node.cpp:340）。夾掉之後 DWB 的
      #      預測模型就和飛機實際的動作不符，會比慢更糟 —— 和下面
      #      max_vel_theta 那一條是同一個坑。
      #   ② 區域 costmap 只有 6x6 m：sim_time 2.0 秒 x 1.2 = 2.4 m，
      #      還在半寬 3 m 以內。設 1.5 就剛好用滿，等於模擬到看不見的地方。
      #
      # ⚠️ 巡航（api/patrol）和追蹤（api/track）的 2.0 m/s 是**另一條路**，
      #    不要拿來當這裡的目標值：那兩個送 DO_REPOSITION 由 PX4 自己的
      #    navigator 飛，不經過 cmd_vel 和那座橋，所以不受上面兩個天花板限制。
      # A200 原廠上限 1.0 m/s（model.sdf 的 max_linear_velocity）。
      # 倒車留 -0.3：卡住時 backup 行為要用，但不讓它當成常態。
      min_vel_x: -0.3
      max_vel_x: 1.0
      # ⚠️ Nav2 預設 max_vel_y 是 0.0（差速車不能橫移）。
      #    照抄的話無人機就浪費了全向的能力。
      # ⚠️ 差速車不能側移。這兩個一定要是 0，否則 DWB 會規劃出橫移的
      #    軌跡，而車子做不到 → 永遠追不上自己的計畫。
      min_vel_y: 0.0
      max_vel_y: 0.0
      # 不跟著調：橋的 max_yawspeed 是 1.0，而且走道只有 4 m 寬，
      # 轉太快在這裡沒有好處（理由見下面 critics 那一段）。
      # 差速車只能靠轉向改變方向，給得比無人機大。
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0

      # 加速度上限。無人機靠傾斜產生水平加速度，給太大會要求很大的傾角。
      #
      # ⚠️ 2026-10-12：1.0 → 1.5，和上面的速度一起調。
      #    只提速度上限不提加速度是白調的：acc 1.0 要 1.2 秒、滑行 0.72 m
      #    才加得到 1.2 m/s，在 4 m 寬的走道裡短程移動根本到不了新上限。
      #    1.5 m/s² 約 8.7 度傾角（1.0 約 6 度）。
      #
      #    實機那份不能跟著放寬 —— 那邊的理由是「傾角大光達會打到地板」
      #    （S4 的坑）。倉庫的 x500_cam_down **沒有光達**（這也正是區域
      #    costmap 改用 static_layer 的原因），所以這裡可以比實機寬。
      #
      #    煞停距離：1.2 m/s 配 decel 1.5 → 0.48 m，xy_goal_tolerance 是 0.4。
      # 煞停距離：1.0 m/s 配 decel 1.5 → 0.33 m，小於 xy_goal_tolerance 0.25
      # 的兩倍，不會衝過終點。
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5

      # 取樣數。⚠️ 2026-10-07：20/10/10（2000 條）→ 10/10/5（500 條），
      # 和實機那份對齊。
      #   vx 和 vy 改成對稱（都 10）—— 四旋翼是全向的，沒有理由「往前」的
      #     解析度比「橫移」高一倍。原本的不對稱是從地面車預設抄來的
      #     （差速車不能橫移，vy_samples 通常是 1）。
      #   vθ 砍最多（10→5）—— yaw_goal_tolerance 是 3.14，代表完全不在乎
      #     最終機頭朝向，加上下面新增的 Twirling 本來就會壓低轉速，
      #     這一軸最不需要解析度。
      # vy 只留 1 個樣本（＝只有 0），差速車沒有別的選擇。
      # 省下來的預算給 vθ：方向全靠轉，取樣太少會轉得一頓一頓的。
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      # 每條候選軌跡往前模擬幾秒。2.0 秒 x 1.2 m/s = 2.4 m，
      # 小於 local_costmap 的半寬 3 m，不會模擬到看不見的地方。
      # ⚠️ 速度再往上調就要一起看這一行（1.5 m/s 剛好用滿 3 m）。
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      # ⚠️ 2026-11-07：0.25 → 0.40。對一台 0.99 m 長的滑移轉向車太緊 ——
      #    實測停在離目標 0.28 m 就搶不到最後 3 公分，只能原地抽動。
      #    0.40 和無人機那份一致，也大於煞停距離 0.33 m（1.0 m/s 配 decel 1.5）。
      xy_goal_tolerance: 0.40
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # 差速車的 critic 組合（和無人機相反，理由見檔頭）：
      #   PathAlign / GoalAlign  獎勵「車頭對準路徑／目標」—— 差速車必要
      #   RotateToGoal           **拿掉**（2026-11-07）：終點朝向已改成不檢查，
      #                          留著只會讓它在終點一直想轉
      #   Twirling               **拿掉**：那是壓抑全向機體亂轉用的，
      #                          留著會讓車子不敢轉、卡在原地
      #   BaseObstacle           對致命格硬拒絕，真正的安全網
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "GoalDist",
                "PathAlign", "PathDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

# -----------------------------------------------------------------------------
#  行為樹導航（S6）—— RViz 的「2D Goal Pose」由它接收
# -----------------------------------------------------------------------------
/husky/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: husky/base_link
    # px4_tf_node 會發這個（S6 新增）
    odom_topic: /husky/odom
    # ⚠️ 2026-10-07：10 → 50（行為樹從 100 Hz 降到 20 Hz）。
    bt_loop_duration: 50
    # ⚠️ 2026-10-07：20 → 200。這一項是 bug fix，和 CPU 無關。
    #
    # 單位是毫秒（nav2_behavior_tree/bt_action_server_impl.hpp:119-120 把它
    # 餵給 std::chrono::milliseconds）。20 ms 是「等 action server 回應
    # goal 被接受」的上限，在負載下本來就不夠。
    #
    # 超時的後果不是重試，而是永久卡死：
    #     nav2_behavior_tree/bt_action_node.hpp:219-228
    #       future_goal_handle_.reset();  return BT::NodeStatus::FAILURE;
    # 行為樹把 handle 丟掉了，但那個 goal 還是會送到 server 並被接受 ——
    # 變成沒有人認領的孤兒 goal，之後每一拍都印 "Aborting handle"，
    # 只能重開整個 Nav2。2026-10-06 實機就是這樣死在第三個目標。
    #
    # 倉庫這邊更不能留 20：L4 的視覺追蹤本質是「~1 Hz 不斷重送目標」，
    # 那正是最容易觸發這個超時的用法。
    default_server_timeout: 200
    wait_for_service_timeout: 1000

# -----------------------------------------------------------------------------
#  復原行為（S6）—— 卡住時原地轉、後退
# -----------------------------------------------------------------------------
/husky/behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: husky/odom
    robot_base_frame: husky/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
